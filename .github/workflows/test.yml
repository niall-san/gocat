---
name: Test master
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      hashcat_refs:
        description: 'JSON list of hashcat tags or branches to test against, e.g. ["v8.0.0", "master"]'
        required: true
        default: '["v8.0.0"]'
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        hashcat_ref: ${{ fromJSON(github.event.inputs.hashcat_refs || '["v8.0.0"]') }}
    name: hashcat ${{ matrix.hashcat_ref }}
    steps:
      - name: Install build dependencies
        run: sudo apt-get update -y && sudo apt-get install -y ocl-icd-libopencl1 opencl-headers pocl-opencl-icd
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
      - name: Checkout hashcat
        uses: actions/checkout@v7
        with:
          repository: hashcat/hashcat
          ref: ${{ matrix.hashcat_ref }}
          path: hashcat
      - name: Install hashcat
        working-directory: ./hashcat
        run: sudo make -j"$(nproc)" install SHARED=1 ENABLE_BRAIN=0
      - name: Build gocat test binary
        # libhashcat's installed headers omit some that gocat's cgo wrapper includes, so build
        # against the hashcat source tree instead
        run: |
          HC="$GITHUB_WORKSPACE/hashcat"
          export CGO_CFLAGS="-I$HC/include -I$HC/OpenCL -I$HC/deps/OpenCL-Headers -I$HC/deps/LZMA-SDK/C -I$HC/deps/zlib/contrib"
          export CGO_LDFLAGS="-L/usr/local/lib -lhashcat"
          go vet ./...
          go test -c
      - name: Copy gocat.test and test files to the test directory
        run: |
          sudo cp gocat.test /usr/local/share/hashcat
          sudo cp -r testdata /usr/local/share/hashcat
      - name: Run gocat tests
        run: sudo LD_LIBRARY_PATH=$LD_LIBRARY_PATH:/usr/local/lib /usr/local/share/hashcat/gocat.test -test.v
